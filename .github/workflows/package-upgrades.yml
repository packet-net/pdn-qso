name: package upgrades

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: package-upgrades
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Always the default branch: a manual run from a feature branch must not push it to main.
          ref: main
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check the tools this job needs
        run: scripts/ci-require-tools.sh dpkg-deb:dpkg
      - name: Upgrade, build and test
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump-packages.py PdnQso.slnx | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet restore --no-http-cache
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build
          # Package smoke build: a dependency bump that breaks the .deb fails this attempt.
          debian/build-deb.sh 0.0.0-ci amd64 "$RUNNER_TEMP/artifacts"
          listing="$(dpkg-deb --contents "$RUNNER_TEMP/artifacts/pdn-qso_amd64.deb")"
          grep -q 'usr/lib/pdn-qso/pdn-qso$' <<<"$listing"
          grep -q 'usr/bin/pdn-qso ->' <<<"$listing"
          grep -q 'usr/share/doc/pdn-qso/copyright$' <<<"$listing"
          grep -q 'usr/lib/pdn-qso/libe_sqlite3\.so$' <<<"$listing"
          grep -q 'usr/lib/pdn-qso/libSystem\.IO\.Ports\.Native\.so$' <<<"$listing"
          if grep -q 'systemd' <<<"$listing"; then echo '::error::the .deb ships a systemd unit'; exit 1; fi
      - name: Security pass (only when the full upgrade failed)
        id: security
        if: steps.full.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          # Drop the failed attempt's edits so the security pass starts from the committed tree.
          git reset --hard
          git clean -fdx -e .dotnet
          python3 scripts/bump-packages.py PdnQso.slnx --vulnerable-only | tee "$RUNNER_TEMP/upgrades.txt"
          dotnet restore --no-http-cache
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build

          # Package smoke build: a dependency bump that breaks the .deb fails this attempt.
          debian/build-deb.sh 0.0.0-ci amd64 "$RUNNER_TEMP/artifacts"
          listing="$(dpkg-deb --contents "$RUNNER_TEMP/artifacts/pdn-qso_amd64.deb")"
          grep -q 'usr/lib/pdn-qso/pdn-qso$' <<<"$listing"
          grep -q 'usr/bin/pdn-qso ->' <<<"$listing"
          grep -q 'usr/share/doc/pdn-qso/copyright$' <<<"$listing"
          grep -q 'usr/lib/pdn-qso/libe_sqlite3\.so$' <<<"$listing"
          grep -q 'usr/lib/pdn-qso/libSystem\.IO\.Ports\.Native\.so$' <<<"$listing"
          if grep -q 'systemd' <<<"$listing"; then echo '::error::the .deb ships a systemd unit'; exit 1; fi

      - name: Commit and push on a green build
        if: success()
        shell: bash
        env:
          SUBJECT: "${{ steps.full.outcome == 'failure' && 'chore(deps): security package fixes' || 'chore(deps): package upgrades' }}"
        run: |
          set -euo pipefail
          # Untracked build leftovers are not changes; the script only edits tracked files.
          if [ -z "$(git status --porcelain --untracked-files=no)" ]; then
            echo "nothing to upgrade"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          {
            echo "$SUBJECT"
            echo
            echo "Package versions changed by scripts/bump-packages.py:"
            cat "$RUNNER_TEMP/upgrades.txt"
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git pull --rebase origin main
          git push origin HEAD:main

