name: release

# The release pipeline for a `v*` tag: test, build the .deb packages for amd64/arm64/armhf, and
# attach them to a GitHub Release whose notes are written from the PR titles merged since the
# previous tag.
#
# workflow_dispatch builds everything and leaves it as workflow artifacts without releasing
# anything - a full dry run of the pipeline. Set `publish: true` to also cut the Release.
#
# There is no NuGet step: pdn-qso is an application, not a library. Nothing here is meant to be
# consumed as a package.
#
# Runs as a single job on purpose: the runner is self-hosted and memory-bounded, so the three
# self-contained publishes go one at a time, and keeping them in one job avoids shuttling
# ~30 MB artifacts between jobs to do it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.0 or 0.2.0-rc1)'
        required: true
      publish:
        description: 'Also cut the GitHub Release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    # APT_DISPATCH_TOKEN is job level, not step level: a secret put in a step's own env: is
    # not visible to that step's if:, so the "is the token there?" test in the apt-notify
    # steps has to read it from here.
    env:
      GH_TOKEN: ${{ github.token }}
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
    steps:
      # Node 24, so an Actions runner of 2.327.1 or newer. See ci.yml.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes are written from first-parent history between tags

      # The xUnit v3 / MTP test apphosts (OutputType=Exe) resolve the runtime via DOTNET_ROOT;
      # the runner's distro dotnet lives outside the apphost's default search paths, so register
      # it explicitly or every test invocation dies with "You must install .NET". Same fix as
      # ci.yml.
      - name: Register .NET root for MTP apphosts
        run: echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"

      - name: Preflight
        run: |
          # dpkg-deb ships in the Essential `dpkg` package, so this only trips if the runner is
          # not Debian-family - in which case it cannot build .debs at all.
          command -v dpkg-deb >/dev/null || {
            echo "::error::dpkg-deb is missing - this job needs a Debian-family runner"
            exit 1
          }
          command -v gh >/dev/null || { echo "::error::gh CLI is missing on this runner"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is missing on this runner"; exit 1; }

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::no version (tag v* or the version input is required)"
            exit 1
          fi
          # Debian is stricter than SemVer: a version must start with a digit.
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::version '$version' must start with a digit"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # A hyphen means a SemVer prerelease (0.2.0-rc1); mark the release accordingly.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Restore past the HTTP cache. This runner is self-hosted and keeps its NuGet cache
      # between jobs forever, so a dependency published minutes ago is invisible to it while
      # nuget.org already serves the package - which is every release cut just after a
      # pdn-soundmodem bump. An ephemeral runner never sees this; ours would see it every time.
      - name: Restore (bypassing the NuGet HTTP cache)
        run: dotnet restore --no-http-cache

      # The runner is Microsoft.Testing.Platform, opted into by global.json's `test.runner`,
      # and it names its own failures on stdout. See ci.yml.
      - name: Test
        run: dotnet test --configuration Release --no-restore

      - name: Build .deb packages
        run: |
          set -euo pipefail
          # Pin the changelog date to the commit being built so a rebuild of a tag is
          # byte-identical. %ct is always a Unix timestamp, unlike the event payload's
          # pushed_at, which is an integer for push events and an ISO string elsewhere.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for arch in amd64 arm64 armhf; do
            echo "::group::deb $arch"
            debian/build-deb.sh "${{ steps.version.outputs.version }}" "$arch" ./artifacts
            echo "::endgroup::"
          done

      - name: Verify .deb contents
        run: |
          set -euo pipefail
          for deb in ./artifacts/*.deb; do
            echo "::group::$(basename "$deb")"
            dpkg-deb --info "$deb"
            # Capture the listing once and match it in memory. Piping dpkg-deb straight into
            # `grep -q` makes grep close the pipe the moment it matches, and the SIGPIPE
            # dpkg-deb takes for that becomes a pipeline failure under pipefail.
            listing="$(dpkg-deb --contents "$deb")"
            echo "$listing"
            grep -q 'usr/lib/pdn-qso/pdn-qso$' <<<"$listing"
            grep -q 'usr/bin/pdn-qso ->' <<<"$listing"
            grep -q 'usr/share/doc/pdn-qso/copyright$' <<<"$listing"
            # The frame log is SQLite, and its native shim is published loose beside the bundle.
            grep -q 'usr/lib/pdn-qso/libe_sqlite3\.so$' <<<"$listing"
            # A user-run tool ships no unit file and seeds no config.
            if grep -q 'systemd\|etc/pdn-qso' <<<"$listing"; then
              echo "::error::this .deb looks like a service - pdn-qso is a user-run tool"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Checksums
        working-directory: ./artifacts
        run: |
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: pdn-qso-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.deb
            artifacts/SHA256SUMS
          if-no-files-found: error

      - name: GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # One bullet per merged PR (or direct commit) since the previous tag, grouped by kind,
          # from first-parent history - no rehashed install text, no API calls.
          python3 scripts/release-notes.py "$TAG" > /tmp/pdn-qso-relnotes.md
          cat /tmp/pdn-qso-relnotes.md

          prerelease=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - replacing its assets and notes"
            gh release upload "$TAG" ./artifacts/*.deb ./artifacts/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file /tmp/pdn-qso-relnotes.md
          else
            gh release create "$TAG" \
              ./artifacts/*.deb ./artifacts/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "pdn-qso $VERSION" \
              --notes-file /tmp/pdn-qso-relnotes.md \
              $prerelease
          fi

      - name: Tell the apt repo to rebuild
        # Last, and only after the GitHub Release has succeeded: packet-net/apt indexes
        # whatever is on releases/latest when it runs, so dispatching before the assets exist
        # would just make it re-index the previous release. Same publish gate as that step, so
        # a dry run never dispatches.
        if: steps.version.outputs.publish == 'true' && env.APT_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Fire and forget: packet-net/apt rebuilds its whole index from every source repo's
          # latest release, so the payload is only there for the run log. A failure here must
          # not fail a release that has already shipped - the daily cron picks it up.
          #
          # gh api --input - with a JSON body, not -f client_payload[...]=...: gh's -f does not
          # do curl-style bracket nesting, so the nested object has to arrive as JSON.
          payload=$(printf '{"event_type":"release-published","client_payload":{"repo":"%s","tag":"%s"}}' \
            "$GITHUB_REPOSITORY" "$TAG")
          if printf '%s' "$payload" | gh api -X POST repos/packet-net/apt/dispatches --input -; then
            echo "apt repo rebuild triggered."
          else
            echo "::warning::could not trigger the packet-net/apt rebuild; its daily cron will pick this release up."
          fi

      - name: Warn if APT_DISPATCH_TOKEN missing
        # Not a failure. The apt repo's cron is the fallback, so a release without the secret
        # still reaches apt, just later.
        if: steps.version.outputs.publish == 'true' && env.APT_DISPATCH_TOKEN == ''
        run: echo "::warning::APT_DISPATCH_TOKEN is not visible to this repo - the apt repo was not poked. It will pick this release up on its next scheduled rebuild."
